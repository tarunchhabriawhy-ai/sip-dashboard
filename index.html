<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushboo's SIP Drawdown Analysis</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <style>
        body { margin: 0; background-color: #030712; color: #f1f5f9; font-family: -apple-system, sans-serif; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        h1 { text-align: center; background: linear-gradient(135deg, #f1f5f9, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-tabs { display: flex; gap: 4px; background: #0f172a; padding: 4px; border-radius: 10px; margin-bottom: 30px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; background: transparent; color: #475569; font-weight: bold; }
        .tab-btn.active { background: #1e293b; color: #f1f5f9; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        const { AreaChart, Area, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell } = Recharts;

        const crashes = [
            { id: "gfc", name: "2008 GFC", drop: "-64%", recovery: "22 Months", color: "#ef4444", data: [{m:1, v:100}, {m:6, v:95}, {m:12, v:40}, {m:18, v:36}, {m:24, v:60}, {m:36, v:100}] },
            { id: "covid", name: "2020 COVID", drop: "-42%", recovery: "6 Months", color: "#f97316", data: [{m:1, v:100}, {m:2, v:98}, {m:3, v:58}, {m:5, v:75}, {m:10, v:100}] }
        ];

        const sipUnits = [
            { stage: "Normal", units: 45 }, { stage: "Crash -20%", units: 56 }, { stage: "Crash -40%", units: 75 }, { stage: "Bottom -50%", units: 90 }
        ];

        function App() {
            const [tab, setTab] = useState('crashes');
            const [crashIdx, setCrashIdx] = useState(0);

            return (
                <div className="container">
                    <h1>Khushboo's SIP Resilience</h1>
                    <div className="nav-tabs">
                        <button className={`tab-btn ${tab==='crashes'?'active':''}`} onClick={()=>setTab('crashes')}>📉 Crashes</button>
                        <button className={`tab-btn ${tab==='sip'?'active':''}`} onClick={()=>setTab('sip')}>🎯 SIP Advantage</button>
                    </div>

                    {tab === 'crashes' ? (
                        <div className="card">
                            <div style={{display:'flex', gap:10, marginBottom:20}}>
                                {crashes.map((c, i) => (
                                    <button key={c.id} onClick={()=>setCrashIdx(i)} style={{padding:'8px 16px', borderRadius:6, border:'1px solid #334155', background: crashIdx===i?c.color:'transparent', color:'white', cursor:'pointer'}}>{c.name}</button>
                                ))}
                            </div>
                            <div style={{height:300}}>
                                <ResponsiveContainer>
                                    <AreaChart data={crashes[crashIdx].data}>
                                        <XAxis dataKey="m" stroke="#475569" />
                                        <YAxis stroke="#475569" />
                                        <Tooltip contentStyle={{background:'#0f172a', border:'1px solid #334155'}}/>
                                        <Area type="monotone" dataKey="v" stroke={crashes[crashIdx].color} fill={crashes[crashIdx].color} fillOpacity={0.2} strokeWidth={3} />
                                    </AreaChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    ) : (
                        <div className="card">
                            <h3>Units Bought per ₹4,500 SIP</h3>
                            <div style={{height:300}}>
                                <ResponsiveContainer>
                                    <BarChart data={sipUnits}>
                                        <XAxis dataKey="stage" stroke="#475569" />
                                        <YAxis stroke="#475569" />
                                        <Bar dataKey="units" fill="#22c55e" radius={[6,6,0,0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
