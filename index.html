<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushboo's SIP Drawdown Analysis</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <style>body { margin: 0; background-color: #030712; }</style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        const { AreaChart, Area, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine } = Recharts;

        // Data from your drawdown_simulation.jsx
        const crashes = [
          { id: "gfc2008", name: "2008 Global Financial Crisis", color: "#ef4444", months: Array.from({ length: 48 }, (_, i) => ({ month: i + 1, totalMarket: i >= 6 && i <= 18 ? 100 - ((i - 6) / 12) * 64 : i > 18 ? Math.min(100, 36 + ((i - 18) / 22) * 64) : 100 })) },
          { id: "covid2020", name: "2020 COVID Crash", color: "#f97316", months: Array.from({ length: 24 }, (_, i) => ({ month: i + 1, totalMarket: i >= 2 && i <= 4 ? 100 - ((i - 2) / 2) * 42 : i > 4 ? Math.min(100, 58 + ((i - 4) / 6) * 42) : 100 })) }
        ];

        const sipUnitsData = [
          { month: "Normal", units: 45 }, { month: "Crash -20%", units: 56 }, { month: "Crash -40%", units: 75 }, { month: "Bottom -50%", units: 90 }
        ];

        function App() {
          const [tab, setTab] = useState("crashes");
          return (
            <div style={{ minHeight: "100vh", color: "#f1f5f9", fontFamily: "serif", padding: "40px 20px", textAlign: "center" }}>
                <h1 style={{fontSize: "28px"}}>Khushboo's SIP Resilience Dashboard</h1>
                <p style={{color: "#64748b"}}>₹4,500/month · Total Market Index · 15-Year Horizon</p>
                
                <div style={{ display: "flex", gap: 10, justifyContent: "center", margin: "30px 0" }}>
                    <button onClick={() => setTab("crashes")} style={{padding: "10px 20px", cursor: "pointer", background: tab === "crashes" ? "#1e293b" : "#0f172a", color: "white", border: "1px solid #334155", borderRadius: "8px"}}>Historical Crashes</button>
                    <button onClick={() => setTab("sip")} style={{padding: "10px 20px", cursor: "pointer", background: tab === "sip" ? "#1e293b" : "#0f172a", color: "white", border: "1px solid #334155", borderRadius: "8px"}}>SIP Advantage</button>
                </div>

                {tab === "crashes" ? (
                    <div style={{background: "#0f172a", padding: "20px", borderRadius: "12px", maxWidth: "800px", margin: "0 auto"}}>
                        <h3>Market Peak-to-Trough Simulation</h3>
                        <ResponsiveContainer width="100%" height={300}>
                            <AreaChart data={crashes[0].months}><CartesianGrid stroke="#1e293b"/><XAxis dataKey="month" stroke="#475569"/><YAxis stroke="#475569"/><Tooltip/><Area type="monotone" dataKey="totalMarket" stroke="#ef4444" fill="#ef4444" fillOpacity={0.2} /></AreaChart>
                        </ResponsiveContainer>
                    </div>
                ) : (
                    <div style={{background: "#0f172a", padding: "20px", borderRadius: "12px", maxWidth: "800px", margin: "0 auto"}}>
                        <h3>Units Bought per ₹4,500 SIP</h3>
                        <ResponsiveContainer width="100%" height={300}>
                            <BarChart data={sipUnitsData}><CartesianGrid stroke="#1e293b"/><XAxis dataKey="month" stroke="#475569"/><YAxis stroke="#475569"/><Bar dataKey="units" fill="#22c55e" radius={[4, 4, 0, 0]} /></BarChart>
                        </ResponsiveContainer>
                    </div>
                )}
            </div>
          );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
